# Manifiesto del corpus de ley-energia-mx.
#
# Cada documento declara de dónde sale su texto y su estado jurídico. `ley-energia actualizar`
# descarga y trocea lo que dice este archivo; `ley-energia indexar` arma el índice. Para sumar un
# documento basta con agregar una entrada y correr los dos comandos.
#
# Campos:
#   id               identificador estable (minúsculas, sin espacios)
#   titulo           título oficial
#   abreviatura      sigla usual (opcional); también se reconoce en las consultas
#   alias            otros nombres con que se busca (opcional)
#   tipo             ley | reglamento | dacg
#   emisor           autoridad que lo expide
#   fecha_pub        publicación en el DOF (AAAA-MM-DD)
#   vigor_desde      entrada en vigor, si se verificó en los transitorios (si falta, se usa fecha_pub)
#   abrogada_desde   fecha desde la que deja de estar vigente (sólo abrogados)
#   sustituido_por   id del documento que lo sustituye (sólo abrogados)
#   base             fundamento de la abrogación o sustitución (sólo abrogados)
#   nota_vigencia    matiz sobre la aplicación real (opcional)
#   fuente           formato (leyes-mx | pdf | dof) y url del texto que se descarga
#   url_oficial      liga para citar: DOF o Cámara de Diputados
#
# Fechas verificadas contra el DOF, el índice de la Cámara de Diputados y los transitorios de cada
# instrumento. Corte del corpus: ver `corte` abajo.

corte: "2026-11-25"

