name: Sitio

# Publica web/ en GitHub Pages. Los datos del sitio (web/datos) se generan aquí desde el corpus
# versionado; no se guardan en git.
on:
  push:
    branches: [main]
    paths: ["web/**", "corpus/**", "src/**", "evaluacion/resultados.json"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      # El sitio busca en el navegador con la señal léxica: no hace falta el modelo de vectores.
      - run: uv run --frozen ley-energia indexar --sin-vectores
      - run: uv run --frozen ley-energia exportar-web
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
